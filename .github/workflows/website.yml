name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'qumat/**'
      - 'qdp/qdp-core/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

jobs:
  generate-and-commit-docs:
    name: Generate & Commit API Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessary to track changed files
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Check for Code Changes
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            qumat/**
            qdp/qdp-core/**
            scripts/generate-*-docs.sh

      - name: Run Doc Generation
        # Only runs if the files defined above were modified
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Source code changed. Generating docs..."
          # Your existing Python/Rust setup and script execution here

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install tools
        run: |
          pip install pydoc-markdown
          cargo install rustdoc-md

      - name: Generate Python API docs
        run: ./scripts/generate-python-docs.sh

      - name: Generate Rust API docs
        run: ./scripts/generate-rust-docs.sh

      - name: Commit updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api/python/index.md docs/api/rust/index.md
          
          # Only commit and push if there are actual changes
          if ! git diff --cached --quiet; then
            git commit -m "docs: auto-generate API documentation"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "No changes to commit"
          fi
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Deploy to asf-site branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Create a temporary directory for the build
          BUILD_DIR=$(mktemp -d)
          cp -r website/build/* $BUILD_DIR/

          # Fetch and checkout asf-site branch
          git fetch origin asf-site
          git checkout -B asf-site origin/asf-site || git checkout --orphan asf-site

          # Remove old content (except .git, .asf.yaml, and .claude if present)
          find . -maxdepth 1 ! -name '.git' ! -name '.asf.yaml' ! -name '.claude' ! -name 'website' ! -name '.' ! -name '..' -exec rm -rf {} +

          # Copy new content
          cp -r $BUILD_DIR/* .

          # Remove website source directory (only keep built site)
          rm -rf website

          # Add and commit changes
          git add -A

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit --no-verify -m "Automatic Site Publish by GitHub Actions"
            git push origin asf-site
            echo "Website deployed successfully to asf-site branch"
          fi

name: API Documentation

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'qumat/**'                  # Added: Python source
      - 'qdp/qdp-core/**'           # Added: Rust core
      - 'scripts/generate-*-docs.sh' # Added: Doc scripts
      - '.github/workflows/**'      # Added: Workflow changes
  workflow_dispatch: # Allow manual trigger from GitHub UI
jobs:
  generate-and-commit-docs:
    name: Generate & Commit API Docs
    runs-on: ubuntu-latest
    # Added a conditional check so this job ONLY runs if code changed
    if: |
      contains(github.event.pull_request.labels.*.name, 'dependencies') ||
      any(github.event.pull_request.changed_files, 'qumat/**', 'qdp/qdp-core/**', 'scripts/**')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install tools
        run: |
          pip install pydoc-markdown
          cargo install rustdoc-md

      - name: Generate Python API docs
        run: ./scripts/generate-python-docs.sh

      - name: Generate Rust API docs
        run: ./scripts/generate-rust-docs.sh

      - name: Commit updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api/python/index.md docs/api/rust/index.md
          git diff --cached --quiet || git commit -m "docs: auto-generate API documentation"
          git push
